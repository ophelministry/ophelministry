<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Ophel Ministry</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; color: #333; }
        header { background: #333; color: #fff; padding: 10px 20px; text-align: center; }
        nav a { color: #fff; margin: 0 10px; text-decoration: none; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #333; color: #fff; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
        button:hover { background: #555; }
        footer { text-align: center; margin-top: 40px; color: #777; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <h1>Ophel Ministry</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About Us</a> | 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Have questions or want to get in touch? Send us a message using the form below or email us directly.</p>
        
        <!-- Note: To make this form send actual emails later, you can connect it to a free service like Formspree -->
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Ophel Ministry. All Rights Reserved.</p>
    </footer>

</body>
</html>
